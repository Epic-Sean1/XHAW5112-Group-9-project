
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Next Level Gaming & Esports Arena</title>

    <!--Website Stylesheet-->
    <link rel="stylesheet" href="style.css">

    <!--Font Awesome Social Media Icons-->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!--Shared Header and Navigation-->
    <header>
        <a href="index.html">
            <img src="images/logo.jpg"
                 alt="Next Level Gaming and Esports Arena Logo"
                 width="110">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="packages.html">Gaming Packages</a>
            <a href="experiences.html">Experiences</a>
            <a href="fees.html">Fees</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!--Contact Us Page-->
    <main class="contact-page">

        <h1 class="contact-heading">CONTACT US</h1>

        <section class="contact-content">

            <!--Contact Information-->
            <div class="contact-information">

                <!--Phone-->
                <div class="contact-item">
                    <img src="images/phone.jpg"
                         alt="Phone icon">

                    <div>
                        <h3>Phone</h3>
                        <p>011 1234567</p>
                    </div>
                </div>

                <!--Email-->
                <div class="contact-item">
                    <img src="images/email.jpg"
                         alt="Email icon">

                    <div>
                        <h3>Email</h3>
                        <p>info@nextlevelgaming.co.za</p>
                    </div>
                </div>

                <!--Location-->
                <div class="contact-item">
                    <img src="images/location.jpg"
                         alt="Location icon">

                    <div>
                        <h3>Location</h3>
                        <p>Johannesburg, South Africa</p>
                    </div>
                </div>

                <!--Social Media-->
                <div class="contact-socials">

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>

                </div>

            </div>

            <!--Contact Form-->
            <div class="contact-form-container">

                <form action="#" method="post">

                    <!--Name-->
                    <div class="contact-form-group">
                        <label for="name">Name:</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter name"
                            required>
                    </div>

                    <!--Email-->
                    <div class="contact-form-group">
                        <label for="email">Email Address:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            required>
                    </div>

                    <!--Message-->
                    <div class="contact-form-group">
                        <label for="message">Message:</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Type your message here"
                            required></textarea>
                    </div>

                    <!--Submit Button-->
                    <button type="submit">SEND MESSAGE</button>

                </form>

            </div>

        </section>

    </main>

    <!--Shared Footer-->
    <footer>

        <section class="footer-brand">
            <h2>NEXT LEVEL</h2>
            <p>GAMING &amp; ESPORTS ARENA</p>
        </section>

        <section class="footer-socials">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
        </section>

        <section class="footer-location">
            <p>Johannesburg &bull; Established 2023</p>
        </section>

    </footer>

</body>
</html>
